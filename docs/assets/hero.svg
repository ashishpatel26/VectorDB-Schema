<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Vector Database Schema &amp; Ingestion Guardrails</title>
  <desc id="d">Fail-closed ingestion and tenant-isolated search across six vector databases (pgvector, Qdrant, Weaviate, Milvus, Chroma, LanceDB) and eight industry indexes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#0f1d33"/>
    </linearGradient>
    <linearGradient id="title2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="card"><rect x="4" y="4" width="1192" height="332" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,Menlo,monospace}
    .in{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
    .chip{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
    .pill{animation:pop .6s cubic-bezier(.2,.8,.2,1.2) both}
    .glow1{animation:breathe 6s ease-in-out infinite}
    .glow2{animation:breathe 7s ease-in-out -3s infinite}
    .ic{animation:pulse 4s ease-in-out infinite}
    .gear{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect x="4" y="4" width="1192" height="332" rx="18" fill="url(#bg)" stroke="#26385a" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect x="4" y="4" width="1192" height="332" fill="url(#dots)"/>
    <ellipse class="glow1" cx="300" cy="150" rx="360" ry="190" fill="url(#glowA)"/>
    <ellipse class="glow2" cx="980" cy="210" rx="320" ry="200" fill="url(#glowB)"/>
    <g fill="#5eead4">
      <path id="p1" d="M-20 300 C 200 240, 420 330, 640 260 S 1000 200, 1220 250" fill="none" stroke="#2dd4bf" stroke-opacity="0.10" stroke-width="1.5"/>
      <path id="p2" d="M-20 60 C 240 120, 480 20, 720 80 S 1040 140, 1220 70" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1.5"/>
      <path id="p3" d="M-20 190 C 260 150, 520 230, 780 170 S 1060 120, 1220 160" fill="none" stroke="#a78bfa" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle r="2.4" opacity="0.8"><animateMotion dur="11s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="1.8" opacity="0.6"><animateMotion dur="11s" begin="-4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="2" opacity="0.7"><animateMotion dur="11s" begin="-8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="2.2" fill="#67e8f9" opacity="0.7"><animateMotion dur="14s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="1.6" fill="#67e8f9" opacity="0.5"><animateMotion dur="14s" begin="-6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="1.8" fill="#67e8f9" opacity="0.6"><animateMotion dur="14s" begin="-10s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="2" fill="#c4b5fd" opacity="0.6"><animateMotion dur="9s" begin="-2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="1.6" fill="#c4b5fd" opacity="0.5"><animateMotion dur="9s" begin="-6.5s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    </g>
  </g>

  <g class="in" style="animation-delay:.05s">
    <text x="56" y="68" class="mono" font-size="16" letter-spacing="2" fill="#5eead4">BLUEPRINT · PYTHON 3.14 · LOCAL-FIRST</text>
  </g>
  <g class="in" style="animation-delay:.15s">
    <text x="54" y="124" class="sans" font-size="46" font-weight="800" fill="#f1f5f9">Vector Database Schema</text>
  </g>
  <g class="in" style="animation-delay:.3s">
    <text x="54" y="176" class="sans" font-size="46" font-weight="800" fill="url(#title2)">&amp; Ingestion Guardrails</text>
  </g>
  <g class="in" style="animation-delay:.45s">
    <text x="56" y="216" class="sans" font-size="19" fill="#cbd5e1">Fail-closed ingestion · tenant-isolated search · 6 vector DBs</text>
  </g>

  <g class="sans" font-size="16" font-weight="600" fill="#e2e8f0">
    <g class="pill" style="animation-delay:.7s"><rect x="56" y="244" width="112" height="36" rx="18" fill="#0f2a3a" stroke="#2dd4bf" stroke-opacity=".6"/><circle cx="74" cy="262" r="5" fill="#2dd4bf"/><text x="86" y="268">pgvector</text></g>
    <g class="pill" style="animation-delay:.82s"><rect x="178" y="244" width="98" height="36" rx="18" fill="#0f2a3a" stroke="#22d3ee" stroke-opacity=".6"/><circle cx="196" cy="262" r="5" fill="#22d3ee"/><text x="208" y="268">Qdrant</text></g>
    <g class="pill" style="animation-delay:.94s"><rect x="286" y="244" width="114" height="36" rx="18" fill="#0f2a3a" stroke="#38bdf8" stroke-opacity=".6"/><circle cx="304" cy="262" r="5" fill="#38bdf8"/><text x="316" y="268">Weaviate</text></g>
    <g class="pill" style="animation-delay:1.06s"><rect x="410" y="244" width="96" height="36" rx="18" fill="#0f2a3a" stroke="#60a5fa" stroke-opacity=".6"/><circle cx="428" cy="262" r="5" fill="#60a5fa"/><text x="440" y="268">Milvus</text></g>
    <g class="pill" style="animation-delay:1.18s"><rect x="516" y="244" width="102" height="36" rx="18" fill="#0f2a3a" stroke="#a78bfa" stroke-opacity=".6"/><circle cx="534" cy="262" r="5" fill="#a78bfa"/><text x="546" y="268">Chroma</text></g>
    <g class="pill" style="animation-delay:1.3s"><rect x="628" y="244" width="110" height="36" rx="18" fill="#0f2a3a" stroke="#f472b6" stroke-opacity=".6"/><circle cx="646" cy="262" r="5" fill="#f472b6"/><text x="658" y="268">LanceDB</text></g>
  </g>
  <g class="in" style="animation-delay:1.45s">
    <text x="56" y="314" class="mono" font-size="16" fill="#94a3b8">{industry}_v1_bgesmall_384 · 48 indexes · pre-filtered search</text>
  </g>

  <g class="in" style="animation-delay:.5s">
    <text x="768" y="68" class="mono" font-size="16" letter-spacing="2" fill="#a5b4fc">8 INDUSTRY INDEXES</text>
  </g>
  <g class="sans" font-size="17" fill="#e2e8f0" stroke-linecap="round" stroke-linejoin="round">
    <g class="chip" style="animation-delay:.8s">
      <rect x="768" y="88" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="792" cy="111" r="15" fill="#0f2a3a"/>
      <g transform="translate(782 101) scale(0.84)" fill="none" stroke="#2dd4bf" stroke-width="3"><path d="M12 5v14M5 12h14"/></g>
      <circle class="ic" cx="792" cy="111" r="15" fill="none" stroke="#2dd4bf"/>
      <text x="816" y="117">healthcare</text>
    </g>
    <g class="chip" style="animation-delay:.9s">
      <rect x="968" y="88" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="992" cy="111" r="15" fill="#0f2a3a"/>
      <g transform="translate(982 101) scale(0.84)" fill="none" stroke="#22d3ee" stroke-width="2.2"><path d="M3 10l9-6 9 6M5.5 10v8M10 10v8M14 10v8M18.5 10v8M3 20h18"/></g>
      <circle class="ic" cx="992" cy="111" r="15" fill="none" stroke="#22d3ee" style="animation-delay:-.5s"/>
      <text x="1016" y="117">banking</text>
    </g>
    <g class="chip" style="animation-delay:1s">
      <rect x="768" y="146" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="792" cy="169" r="15" fill="#0f2a3a"/>
      <g transform="translate(782 159) scale(0.84)" fill="none" stroke="#38bdf8" stroke-width="2.2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g>
      <circle class="ic" cx="792" cy="169" r="15" fill="none" stroke="#38bdf8" style="animation-delay:-1s"/>
      <text x="816" y="175">insurance</text>
    </g>
    <g class="chip" style="animation-delay:1.1s">
      <rect x="968" y="146" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="992" cy="169" r="15" fill="#0f2a3a"/>
      <g transform="translate(982 159) scale(0.84)" fill="none" stroke="#60a5fa" stroke-width="2.2"><path d="M12 4v16M7 20h10M5 7h14M5 7l-3 6h6zM19 7l-3 6h6z"/></g>
      <circle class="ic" cx="992" cy="169" r="15" fill="none" stroke="#60a5fa" style="animation-delay:-1.5s"/>
      <text x="1016" y="175">legal</text>
    </g>
    <g class="chip" style="animation-delay:1.2s">
      <rect x="768" y="204" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="792" cy="227" r="15" fill="#0f2a3a"/>
      <g transform="translate(782 217) scale(0.84)" fill="none" stroke="#818cf8" stroke-width="2.2"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></g>
      <circle class="ic" cx="792" cy="227" r="15" fill="none" stroke="#818cf8" style="animation-delay:-2s"/>
      <text x="816" y="233">retail</text>
    </g>
    <g class="chip" style="animation-delay:1.3s">
      <rect x="968" y="204" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="992" cy="227" r="15" fill="#0f2a3a"/>
      <circle class="gear" cx="992" cy="227" r="7.5" fill="none" stroke="#a78bfa" stroke-width="3.5" stroke-dasharray="3.1 2.8"/>
      <circle cx="992" cy="227" r="3.2" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle class="ic" cx="992" cy="227" r="15" fill="none" stroke="#a78bfa" style="animation-delay:-2.5s"/>
      <text x="1016" y="233">manufacturing</text>
    </g>
    <g class="chip" style="animation-delay:1.4s">
      <rect x="768" y="262" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="792" cy="285" r="15" fill="#0f2a3a"/>
      <g transform="translate(782 275) scale(0.84)" fill="none" stroke="#c084fc" stroke-width="2.2"><path d="M3 20h18M5.5 20v-7M10 20v-7M14 20v-7M18.5 20v-7M4 13h16M6 13a6 6 0 0 1 12 0M12 4v3"/></g>
      <circle class="ic" cx="792" cy="285" r="15" fill="none" stroke="#c084fc" style="animation-delay:-3s"/>
      <text x="816" y="291">government</text>
    </g>
    <g class="chip" style="animation-delay:1.5s">
      <rect x="968" y="262" width="188" height="46" rx="12" fill="#101b2e" stroke="#2b3d5f"/>
      <circle cx="992" cy="285" r="15" fill="#0f2a3a"/>
      <g transform="translate(982 275) scale(0.84)" fill="none" stroke="#f472b6" stroke-width="2.2"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2.5 9 2.5 12 0v-5M22 9v6"/></g>
      <circle class="ic" cx="992" cy="285" r="15" fill="none" stroke="#f472b6" style="animation-delay:-3.5s"/>
      <text x="1016" y="291">education_hr</text>
    </g>
  </g>
</svg>
